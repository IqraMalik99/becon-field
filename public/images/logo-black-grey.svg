<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-labelledby="title">
  <title id="title">Beaconsfield</title>
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111" />
      <stop offset="0.5" stop-color="#000000" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3d3d" />
      <stop offset="0.6" stop-color="#1c1c1c" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48" />
      <stop offset="0.5" stop-color="#c4123a" />
      <stop offset="1" stop-color="#8e0e2c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Jet black tile -->
  <rect x="2" y="4" width="88" height="88" rx="22" fill="url(#black)" />
  <rect x="2" y="4" width="88" height="88" rx="22" fill="none" stroke="#4a4a4a" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Grey shade facet -->
  <path d="M46 18h22a22 22 0 0 1 22 22v22a22 22 0 0 1-22 22H46a18 18 0 0 0 18-18V36a18 18 0 0 0-18-18Z" fill="url(#grey)" opacity="0.75" />

  <!-- Bright white beacon glow -->
  <circle cx="46" cy="22" r="15" fill="url(#glow)" opacity="0.9" />
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <path d="M46 5v6" />
    <path d="M31 11l4 5" />
    <path d="M61 11l-4 5" />
  </g>

  <!-- Red beacon signal mark -->
  <path d="M46 22 28 74l18-7 18 7-18-52Z" fill="url(#red)" opacity="0.98" />
  <path d="M46 22 28 74l5-2 18-50-5 0Z" fill="#ffffff" opacity="0.3" />
  <path d="M46 22v45l18 7-18-52Z" fill="#8e0e2c" opacity="0.45" />
  <circle cx="46" cy="22" r="4" fill="#ffffff" />
  <path d="M16 74h60" stroke="url(#red)" stroke-width="2" stroke-linecap="round" />
  <path d="M26 82h40" stroke="#c4123a" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

  <!-- Wordmark only -->
  <text x="104" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.4" fill="#c4123a">Beaconsfield</text>
