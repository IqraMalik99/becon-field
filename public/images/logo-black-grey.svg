<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-labelledby="title">
  <title id="title">Beacons Fields — Making Tech Awesome</title>
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111" />
      <stop offset="0.5" stop-color="#000000" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3d3d" />
      <stop offset="0.6" stop-color="#1c1c1c" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.18" stop-color="#d8d8d8" />
      <stop offset="0.42" stop-color="#808080" />
      <stop offset="0.62" stop-color="#d2d2d2" />
      <stop offset="0.84" stop-color="#6a6a6a" />
      <stop offset="1" stop-color="#b5b5b5" />
    </linearGradient>
    <linearGradient id="silverSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6d6d6" />
      <stop offset="1" stop-color="#7a7a7a" />
    </linearGradient>
  </defs>

  <!-- Jet black tile -->
  <rect x="2" y="4" width="88" height="88" rx="22" fill="url(#black)" />
  <rect x="2" y="4" width="88" height="88" rx="22" fill="none" stroke="#4a4a4a" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Grey shade facet -->
  <path d="M46 18h22a22 22 0 0 1 22 22v22a22 22 0 0 1-22 22H46a18 18 0 0 0 18-18V36a18 18 0 0 0-18-18Z" fill="url(#grey)" opacity="0.75" />

  <!-- Beacon signal mark in dull silver -->
  <path d="M46 22 28 74l18-7 18 7-18-52Z" fill="url(#silver)" opacity="0.96" />
  <path d="M46 22 28 74l5-2 18-50-5 0Z" fill="#ffffff" opacity="0.22" />
  <path d="M46 22v45l18 7-18-52Z" fill="#666666" opacity="0.4" />
  <circle cx="46" cy="22" r="4" fill="url(#silver)" />
  <path d="M16 74h60" stroke="url(#silverSoft)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M26 82h40" stroke="#8c8c8c" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Full wordmark -->
  <text x="104" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.8" fill="url(#silver)">BEACONS</text>
  <text x="105" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="4.2" fill="#c8c8c8">FIELDS</text>
  <text x="106" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2.4" fill="#8c8c8c">MAKING TECH AWESOME</text>
</svg>
